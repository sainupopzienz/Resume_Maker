name: CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ============================================================
  # CI JOB — Build, Scan, AI Analysis
  # ============================================================
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------
      # INSTALL DEPS FIRST
      # --------------------
      - name: Install Python dependencies
        run: pip install openai

      # --------------------
      # BUILD
      # --------------------
      - name: Build Docker image
        run: |
          docker build -t resume-app . 2>&1 | tee build.log
          docker save resume-app -o resume-app.tar
          echo "✅ Docker build completed"
          docker images resume-app

      # --------------------
      # SECURITY SCAN
      # --------------------
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: resume-app.tar
          format: json
          output: scan.json
          severity: CRITICAL,HIGH
          exit-code: '0'
          vuln-type: 'os,library'
          ignore-unfixed: true

      # --------------------
      # AI ANALYSIS
      # --------------------
      - name: AI Analysis
        if: always()
        run: python scripts/analyze_failure.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # --------------------
      # UPLOAD REPORT
      # --------------------
      - name: Upload AI Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-healing-report
          path: auto_healing_report.md
          retention-days: 30

      # --------------------
      # UPLOAD SCAN RESULTS
      # --------------------
      - name: Upload Trivy Scan
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: scan.json
          retention-days: 30

  # ============================================================
  # CD JOB — Deploy to Render
  # ============================================================
  cd:
    needs: ci
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AI Report
        uses: actions/download-artifact@v4
        with:
          name: auto-healing-report

      - name: Deploy to Render
        run: |
          echo "🚀 Triggering Render deployment..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RENDER_DEPLOY_HOOK_URL }})
          echo "Response code: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Render deploy failed with code $RESPONSE"
            exit 1
          fi
          echo "✅ Deployment triggered successfully"

      - name: Deployment Summary
        run: |
          echo "=================================="
          echo "✅ Deployment completed"
          echo "📦 Branch : ${{ github.ref_name }}"
          echo "🔀 Commit : ${{ github.sha }}"
          echo "👤 Author : ${{ github.actor }}"
          echo "=================================="
