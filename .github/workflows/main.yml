name: CI-CD Pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t resume-app .

      - name: Test container
        run: |
          docker run -d -p 8080:80 --name test resume-app
          sleep 5
          curl http://localhost:8080 || exit 1
          docker stop test
          docker rm test

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -f "$DEPLOY_URL"

  analyze_failure:
    if: failure()
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run AI Failure Analyzer
        run: python scripts/analyze_failure.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
